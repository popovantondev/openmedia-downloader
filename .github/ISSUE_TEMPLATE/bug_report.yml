name: Bug report
description: Report a reproducible problem without private account or device data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, cookies, tokens, signed media URLs, personal paths, private titles, or unredacted logs."
  - type: input
    id: version
    attributes:
      label: App version
      description: Use the version shown in the app; do not include a bundle path.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and CPU family
      placeholder: "macOS version; Apple silicon"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Replace private media links and titles with synthetic examples.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste only a short, redacted error message if useful.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed account data, cookies, tokens, signed URLs, personal paths, and private logs.
          required: true
