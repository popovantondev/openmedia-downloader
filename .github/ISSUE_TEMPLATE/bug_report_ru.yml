name: Сообщить об ошибке (Русский)
description: Описать ошибку, которую можно повторить.
title: "[Ошибка]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Не указывайте пароли, cookies, токены, подписанные ссылки на медиа, личные пути, названия приватных видео или неочищенные журналы."
  - type: input
    id: version
    attributes:
      label: Версия приложения
      description: Укажите версию из окна приложения, не путь к bundle.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Версия macOS и тип процессора
      placeholder: "Версия macOS; Apple silicon"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги для повторения ошибки
      description: Замените личные ссылки и названия медиа вымышленными примерами.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: При необходимости вставьте короткий очищенный текст ошибки.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка приватности
      options:
        - label: Я удалил данные аккаунта, cookies, токены, подписанные ссылки, личные пути и приватные журналы.
          required: true
